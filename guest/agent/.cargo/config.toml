# The guest is aarch64 Linux with musl, linked statically by the lld that ships with rustup,
# so building on macOS needs no C toolchain for Linux.
[build]
target = "aarch64-unknown-linux-musl"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
